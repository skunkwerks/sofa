# submit this via `hut builds submit -f .builds/freebsd-15.yml`
image: freebsd/15.x
packages:
  - databases/couchdb3
  - lang/elixir-devel
  - lang/erlang-runtime29
sources:
  - https://git.sr.ht/~dch/sofa
# elixir-devel has no erlang dependency of its own, and erlang-runtime29 is
# not on the default PATH; tasks source ~/.buildenv, which exports these
environment:
  PATH: /usr/local/lib/erlang29/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
tasks:
  - probe: |
      uname -a
      elixir --version
  # start CouchDB early so it is up by the time the integration tests run;
  # see test/integration/README.md for the expected credentials
  - couchdb: |
      sudo tee -a /usr/local/etc/couchdb3/local.ini >/dev/null <<'INI'

      [couchdb]
      single_node = true

      [admins]
      admin = passwd
      INI
      sudo service couchdb3 enable
      sudo service couchdb3 start
  - prepare: |
      cd sofa
      make prepare
  - compile: |
      cd sofa
      make build
  - test: |
      cd sofa
      make test
  - integration: |
      cd sofa
      fetch -o - http://localhost:5984/
      env COUCHDB_URI=http://admin:passwd@localhost:5984/ make integration
  # last, as it is slowest: dialyzer builds its PLT from scratch here
  - lint: |
      cd sofa
      make lint
